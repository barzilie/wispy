<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WiSpy</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #00ff41;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      border-bottom: 1px solid #1a4a1a;
      background: #080808;
      flex-shrink: 0;
    }
    .title { font-size: 1.3em; letter-spacing: 5px; font-weight: bold; }
    .live-badge {
      display: flex; align-items: center; gap: 5px;
      background: #001a00; border: 1px solid #00ff41;
      padding: 2px 10px; font-size: 0.72em; letter-spacing: 2px;
    }
    .live-dot { animation: blink 1s step-end infinite; font-size: 1em; }
    @keyframes blink { 50% { opacity: 0; } }
    .device-count { margin-left: auto; color: #558855; font-size: 0.8em; letter-spacing: 1px; }

    /* ── Main split ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Panels ── */
    .panel { display: flex; flex-direction: column; overflow: hidden; }
    .left-panel  { width: 36%; border-right: 1px solid #1a2a1a; }
    .right-panel { flex: 1; }

    .panel-title {
      padding: 7px 14px;
      font-size: 0.72em;
      letter-spacing: 4px;
      color: #558855;
      border-bottom: 1px solid #1a2a1a;
      background: #090f09;
      flex-shrink: 0;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-thumb { background: #1a3a1a; }

    .empty { color: #333; font-size: 0.8em; padding: 12px; }

    /* ── Device cards ── */
    .device-card {
      border: 1px solid #1a2a1a;
      padding: 9px 12px;
      margin-bottom: 7px;
      transition: border-color 0.15s, background 0.15s;
    }
    .device-card:hover { border-color: #00ff41; background: #0a180a; }

    .device-name  { font-size: 0.95em; font-weight: bold; color: #00ff41; }
    .device-mac   { font-size: 0.7em; color: #335533; margin-top: 1px; }
    .device-meta  { font-size: 0.75em; color: #668866; margin-top: 5px; }
    .device-ip    { color: #00cccc; }
    .device-age   { color: #334433; font-size: 0.7em; margin-top: 3px; }

    /* ── DNS log ── */
    .dns-entry {
      display: flex;
      gap: 10px;
      padding: 4px 10px;
      font-size: 0.78em;
      border-bottom: 1px solid #0f150f;
    }
    .dns-entry:hover { background: #0a180a; }
    .dns-time   { color: #335533; min-width: 70px; flex-shrink: 0; }
    .dns-device { color: #00aaaa; min-width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dns-domain { color: #00ff41; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .log-section-title {
      font-size: 0.68em;
      letter-spacing: 3px;
      color: #558855;
      padding: 6px 0 4px;
      border-top: 1px solid #1a2a1a;
      margin-top: 6px;
    }
    .log-section-title:first-child { border-top: none; margin-top: 0; }
    .log-block {
      max-height: 140px;
      overflow-y: auto;
      margin-bottom: 4px;
    }

    /* ── Recommend section ── */
    .recommend-section {
      border-top: 1px solid #1a2a1a;
      padding: 10px 16px;
      background: #080808;
      flex-shrink: 0;
    }
    #recommend-btn {
      background: none;
      border: 1px solid #00ff41;
      color: #00ff41;
      font-family: inherit;
      font-size: 0.82em;
      letter-spacing: 3px;
      padding: 7px 18px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #recommend-btn:hover:not(:disabled) { background: #00ff41; color: #000; }
    #recommend-btn:disabled { border-color: #223322; color: #223322; cursor: default; }

    #recommend-output {
      display: none;
      margin-top: 10px;
      color: #99cc99;
      font-size: 0.76em;
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
      border-left: 2px solid #1a4a1a;
      padding-left: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<header>
  <span class="title">WiSpy</span>
  <div class="live-badge">
    <span class="live-dot">●</span>
    <span>LIVE</span>
  </div>
  <span class="device-count" id="device-count">0 DEVICES</span>
</header>

<div class="main">
  <div class="panel left-panel">
    <div class="panel-title">DEVICES</div>
    <div class="panel-body" id="devices-list">
      <div class="empty">Waiting for connections...</div>
    </div>
  </div>

  <div class="panel right-panel">
    <div class="panel-title">TRAFFIC LOG</div>
    <div class="panel-body">
      <div class="log-section-title">DNS</div>
      <div class="log-block" id="dns-log">
        <div class="empty">No queries captured yet.</div>
      </div>
      <div class="log-section-title">TLS SNI</div>
      <div class="log-block" id="tls-log">
        <div class="empty">None yet.</div>
      </div>
      <div class="log-section-title">JA3</div>
      <div class="log-block" id="ja3-log">
        <div class="empty">None yet.</div>
      </div>
      <div class="log-section-title">mDNS</div>
      <div class="log-block" id="mdns-log">
        <div class="empty">None yet.</div>
      </div>
    </div>
  </div>
</div>

<div class="recommend-section">
  <button id="recommend-btn" onclick="getRecommendations()">[ ANALYZE WITH AI ]</button>
  <pre id="recommend-output"></pre>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
